[package]
name = "circle-to-gemini"
version = "0.1.0"
edition = "2024"
description = "Circle to Gemini — select anything on your screen and ask Gemini AI about it"
license = "MIT"

[dependencies]
iced = { version = "0.13", features = ["canvas", "image", "tokio", "multi-window", "markdown"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", features = ["png", "jpeg"] }
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
directories = "5"
futures = "0.3"
once_cell = "1"
tokio-stream = "0.1"
bytes = "1"
base64 = "0.22"
open = "5"
arboard = "3"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
